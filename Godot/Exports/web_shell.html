<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		#canvas { display: block; width: 100%; height: 100%; }

		/* VRAM Boot Overlay — photosafe: green-only, no flashing, smooth sweeps */
		#vram-overlay {
			position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background: #000; z-index: 1000; display: flex;
			flex-direction: column; align-items: center; justify-content: center;
			font-family: monospace, Courier, 'Courier New', monospace;
			color: #00ff00; transition: opacity 0.6s ease;
		}
		#vram-overlay.fade-out { opacity: 0; pointer-events: none; }

		#vram-grid {
			display: grid;
			grid-template-columns: repeat(80, 1fr);
			grid-template-rows: repeat(45, 1fr);
			width: min(90vw, 640px);
			aspect-ratio: 16/9;
			border: 1px solid #003300;
		}
		#vram-grid .cell { background: #000; transition: background 0.15s ease; }
		#vram-grid .cell.filled { background: #002200; }
		#vram-grid .cell.sweep { background: #00ff00; }
		#vram-grid .cell.check-a { background: #003300; }
		#vram-grid .cell.check-b { background: #005500; }
		#vram-grid .cell.bar0 { background: #001a00; }
		#vram-grid .cell.bar1 { background: #003300; }
		#vram-grid .cell.bar2 { background: #005500; }
		#vram-grid .cell.bar3 { background: #007700; }

		#vram-status {
			margin-top: 16px; font-size: 14px; letter-spacing: 2px;
			opacity: 0; transition: opacity 0.5s ease; color: #00cc00;
		}
		#vram-status.visible { opacity: 1; }

		#vram-progress {
			margin-top: 8px; font-size: 11px; letter-spacing: 1px;
			opacity: 0; transition: opacity 0.4s ease; color: #005500;
		}
		#vram-progress.visible { opacity: 1; }
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>

	<!-- VRAM Boot Overlay -->
	<div id="vram-overlay">
		<div id="vram-grid"></div>
		<div id="vram-status">VRAM TEST: OK</div>
		<div id="vram-progress">LOADING ENGINE...</div>
	</div>

	<!-- VRAM animation sequence (runs before engine loads) -->
	<script>
	(function() {
		var grid = document.getElementById('vram-grid');
		var statusEl = document.getElementById('vram-status');
		var progressEl = document.getElementById('vram-progress');
		var COLS = 80, ROWS = 45;

		// Build grid cells
		var cells = [];
		for (var i = 0; i < ROWS * COLS; i++) {
			var cell = document.createElement('div');
			cell.className = 'cell';
			grid.appendChild(cell);
			cells.push(cell);
		}

		// Phase 1: Row-by-row green sweep (~1s)
		var sweepRow = 0;
		var phase1 = setInterval(function() {
			if (sweepRow >= ROWS) {
				clearInterval(phase1);
				setTimeout(startPhase2, 300);
				return;
			}
			if (sweepRow > 0) {
				for (var c = 0; c < COLS; c++) {
					var prev = cells[(sweepRow - 1) * COLS + c];
					prev.classList.remove('sweep');
					prev.classList.add('filled');
				}
			}
			for (var c = 0; c < COLS; c++) {
				cells[sweepRow * COLS + c].classList.add('sweep');
			}
			sweepRow++;
		}, 22);

		// Phase 2: Checkerboard grid test (column sweep, ~1.5s)
		function startPhase2() {
			var checkCol = 0;
			var phase2 = setInterval(function() {
				if (checkCol >= COLS) {
					clearInterval(phase2);
					setTimeout(startPhase3, 300);
					return;
				}
				for (var r = 0; r < ROWS; r++) {
					var cell = cells[r * COLS + checkCol];
					cell.classList.remove('filled');
					if ((r + checkCol) % 2 === 0) {
						cell.classList.add('check-a');
					} else {
						cell.classList.add('check-b');
					}
				}
				checkCol++;
			}, 19);
		}

		// Phase 3: Color bars (4 vertical bands, held 800ms)
		function startPhase3() {
			var barWidth = COLS / 4;
			for (var r = 0; r < ROWS; r++) {
				for (var c = 0; c < COLS; c++) {
					var cell = cells[r * COLS + c];
					cell.classList.remove('check-a', 'check-b');
					var barIdx = Math.min(Math.floor(c / barWidth), 3);
					cell.classList.add('bar' + barIdx);
				}
			}
			setTimeout(function() {
				statusEl.classList.add('visible');
				progressEl.classList.add('visible');
			}, 800);
		}
	})();

	// Dismiss VRAM overlay when engine starts rendering
	var _vramDismissed = false;
	function _vramDismiss() {
		if (_vramDismissed) return;
		_vramDismissed = true;
		var overlay = document.getElementById('vram-overlay');
		if (overlay) {
			overlay.classList.add('fade-out');
			setTimeout(function() { overlay.style.display = 'none'; }, 700);
		}
	}
	</script>

	<!-- Godot 4 engine bootstrap -->
	<script src="$GODOT_URL"></script>
	<script>
		var engine = new Engine($GODOT_CONFIG);
		engine.startGame().then(function() {
			// Engine started successfully — dismiss VRAM overlay
			setTimeout(_vramDismiss, 300);
		});
		// Safety: dismiss after 30s even if engine fails
		setTimeout(_vramDismiss, 30000);
	</script>
</body>
</html>
